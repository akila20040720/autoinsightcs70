version: '3.8'

services:
  # ML Model API Service
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehicle_price_ml_api
    ports:
      - "5000:5000"
    volumes:
      # Mount models directory for easy updates
      - ./models:/app/models:ro
      # Mount data directory for training data
      - ./data:/app/data:ro
      # Logs
      - ./logs:/app/logs
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - MODEL_PATH=/app/models
      - PORT=5000
      - DEBUG=False
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ml-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vehicle_price_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ml-api
    restart: unless-stopped
    networks:
      - ml-network

  # Optional: Redis for caching predictions
  redis:
    image: redis:7-alpine
    container_name: vehicle_price_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
