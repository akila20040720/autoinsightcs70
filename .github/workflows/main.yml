name: Main CI

on:
	push:
		branches:
			- main
			- master
	pull_request:
	workflow_dispatch:

permissions:
	contents: read

concurrency:
	group: main-ci-${{ github.ref }}
	cancel-in-progress: true

jobs:
	backend-python:
		name: Backend (Python)
		runs-on: ubuntu-latest

		defaults:
			run:
				shell: bash

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Python
				uses: actions/setup-python@v5
				with:
					python-version: "3.11"
					cache: "pip"
					cache-dependency-path: |
						requirements.txt
						autoinsight-frontend/backend/requirements.txt

			- name: Install root requirements (optional)
				run: |
					if [ -f requirements.txt ]; then
						python -m pip install --upgrade pip
						pip install -r requirements.txt
					else
						echo "No root requirements.txt found. Skipping."
					fi

			- name: Install backend requirements (optional)
				run: |
					if [ -f autoinsight-frontend/backend/requirements.txt ]; then
						python -m pip install --upgrade pip
						pip install -r autoinsight-frontend/backend/requirements.txt
					else
						echo "No backend requirements.txt found. Skipping."
					fi

			- name: Python syntax check (non-blocking)
				continue-on-error: true
				run: |
					python -m compileall -q autoinsight-frontend/backend || true

			- name: Backend tests (non-blocking)
				continue-on-error: true
				run: |
					if [ -d autoinsight-frontend/backend/tests ]; then
						python -m pytest autoinsight-frontend/backend/tests -q || true
					else
						echo "No backend tests folder found. Skipping."
					fi

	frontend:
		name: Frontend (${{ matrix.app_name }})
		runs-on: ubuntu-latest

		strategy:
			fail-fast: false
			matrix:
				include:
					- app_name: auto-frontend
						app_path: autoinsight-frontend/auto-frontend
					- app_name: cs70
						app_path: cs70

		defaults:
			run:
				shell: bash
				working-directory: ${{ matrix.app_path }}

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Node.js
				uses: actions/setup-node@v4
				with:
					node-version: "20"
					cache: npm
					cache-dependency-path: ${{ matrix.app_path }}/package-lock.json

			- name: Install dependencies
				run: |
					if [ -f package-lock.json ]; then
						npm ci
					else
						npm install
					fi

			- name: Lint (non-blocking)
				continue-on-error: true
				run: npm run lint --if-present

			- name: Build (non-blocking)
				continue-on-error: true
				run: npm run build --if-present

			- name: Preview run check (non-blocking)
				continue-on-error: true
				run: npm run preview --if-present -- --host 127.0.0.1 --port 4173

