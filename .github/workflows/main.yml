name: Main CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Pass
        run: echo "CI workflow is healthy"

