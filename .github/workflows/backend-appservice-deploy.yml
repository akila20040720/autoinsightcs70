name: Backend Deploy (Azure App Service)

on:
  push:
    branches: [main]
    paths:
      - autoinsight-frontend/backend/**
      - .github/workflows/backend-appservice-deploy.yml
  workflow_dispatch:

env:
  RESOURCE_GROUP: autoinsight-rg
  ACR_NAME: autoinsightacr
  WEBAPP_NAME: autoinsight-backend
  IMAGE_NAME: scraper-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_and_deploy:
    if: ${{ secrets.AZURE_CREDENTIALS != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            autoinsight-frontend/backend

      - name: Configure App Service container image
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --container-image-name ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Configure App Service port
        run: |
          az webapp config appsettings set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }} \
            --settings WEBSITES_PORT=8000

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP_NAME }}
